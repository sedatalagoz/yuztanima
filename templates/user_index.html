<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fotoğraflarını Bul</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px 0;
        }
        .main-card {
            max-width: 1200px;
            margin: 0 auto;
        }
        .upload-area {
            border: 3px dashed #667eea;
            border-radius: 15px;
            padding: 60px 20px;
            text-align: center;
            background: white;
            cursor: pointer;
            transition: all 0.3s;
        }
        .upload-area:hover {
            border-color: #764ba2;
            background: #f8f9fa;
        }
        .upload-area.dragover {
            border-color: #764ba2;
            background: #e3f2fd;
        }
        .preview-img {
            max-width: 300px;
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .match-card {
            transition: transform 0.3s;
            border-radius: 15px;
            overflow: hidden;
        }
        .match-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }
        .match-img {
            width: 100%;
            height: 250px;
            object-fit: cover;
        }
        .similarity-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 8px 15px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 16px;
        }
        #loading {
            display: none;
        }
        .camera-btn {
            font-size: 48px;
            color: #667eea;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="main-card">
            <div class="card shadow-lg">
                <div class="card-body p-5">
                    <h1 class="text-center mb-3" style="color: #667eea;">📸 Fotoğraflarını Bul</h1>
                    <p class="text-center text-muted mb-5">
                        Selfie çek veya fotoğraf yükle, ajans çekimlerindeki tüm fotoğraflarını görelim!
                    </p>

                    <!-- Yükleme Alanı -->
                    <div id="uploadSection">
                        <div class="upload-area" id="uploadArea">
                            <div class="camera-btn">📷</div>
                            <h4 class="mt-3">Selfie Çek veya Fotoğraf Yükle</h4>
                            <p class="text-muted">Tıkla veya sürükle-bırak</p>
                            <input type="file" id="photoInput" accept="image/*" capture="user" style="display: none;">
                            <button class="btn btn-primary btn-lg mt-3" onclick="document.getElementById('photoInput').click()">
                                📸 Fotoğraf Seç
                            </button>
                        </div>

                        <div id="preview" class="text-center mt-4" style="display: none;">
                            <img id="previewImg" class="preview-img" src="" alt="Preview">
                            <div class="mt-3">
                                <button class="btn btn-success btn-lg" onclick="uploadPhoto()">
                                    ✅ Fotoğraflarımı Bul
                                </button>
                                <button class="btn btn-secondary btn-lg" onclick="resetUpload()">
                                    🔄 Yeniden Seç
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- Yükleniyor -->
                    <div id="loading" class="text-center py-5">
                        <div class="spinner-border text-primary" style="width: 4rem; height: 4rem;" role="status">
                            <span class="visually-hidden">Yükleniyor...</span>
                        </div>
                        <h4 class="mt-4">Fotoğraflar taranıyor...</h4>
                        <p class="text-muted">Bu işlem birkaç saniye sürebilir</p>
                    </div>

                    <!-- Sonuçlar -->
                    <div id="results" style="display: none;">
                        <hr class="my-5">
                        
                        <div class="text-center mb-4">
                            <h2 style="color: #667eea;">🎉 Fotoğrafların Bulundu!</h2>
                            <p class="lead" id="matchCount"></p>
                        </div>

                        <div class="row g-4" id="matchesGrid"></div>

                        <div class="text-center mt-5">
                            <button class="btn btn-primary btn-lg" onclick="location.reload()">
                                🔄 Yeni Arama Yap
                            </button>
                        </div>
                    </div>

                    <!-- Hata -->
                    <div id="error" class="alert alert-danger mt-4" style="display: none;"></div>
                </div>
            </div>

            <!-- Admin Linki -->
            <div class="text-center mt-3">
                <a href="/admin/login" class="text-white text-decoration-none">
                    <small>🔐 Admin Girişi</small>
                </a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let selectedFile = null;

        // Dosya seçimi
        document.getElementById('photoInput').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                selectedFile = file;
                const reader = new FileReader();
                reader.onload = (e) => {
                    document.getElementById('previewImg').src = e.target.result;
                    document.getElementById('preview').style.display = 'block';
                };
                reader.readAsDataURL(file);
            }
        });

        // Drag & Drop
        const uploadArea = document.getElementById('uploadArea');
        
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            
            const file = e.dataTransfer.files[0];
            if (file && file.type.startsWith('image/')) {
                selectedFile = file;
                const reader = new FileReader();
                reader.onload = (e) => {
                    document.getElementById('previewImg').src = e.target.result;
                    document.getElementById('preview').style.display = 'block';
                };
                reader.readAsDataURL(file);
            }
        });

        // Fotoğraf yükleme
        async function uploadPhoto() {
            if (!selectedFile) return;

            document.getElementById('uploadSection').style.display = 'none';
            document.getElementById('loading').style.display = 'block';
            document.getElementById('error').style.display = 'none';

            const formData = new FormData();
            formData.append('photo', selectedFile);

            try {
                const response = await fetch('/upload_selfie', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                document.getElementById('loading').style.display = 'none';

                if (response.ok && data.success) {
                    showResults(data);
                } else {
                    showError(data.error || 'Bir hata oluştu');
                }
            } catch (error) {
                document.getElementById('loading').style.display = 'none';
                showError('Bağlantı hatası: ' + error.message);
            }
        }

        // Sonuçları göster
        function showResults(data) {
            document.getElementById('matchCount').textContent = 
                `${data.matches_count} fotoğraf bulundu!`;

            const grid = document.getElementById('matchesGrid');
            grid.innerHTML = '';

            if (data.matches_count === 0) {
                grid.innerHTML = `
                    <div class="col-12">
                        <div class="alert alert-warning text-center">
                            <h4>😔 Üzgünüz</h4>
                            <p>Ajans fotoğrafları arasında eşleşme bulunamadı.</p>
                        </div>
                    </div>
                `;
            } else {
                data.matches.forEach(match => {
                    const col = document.createElement('div');
                    col.className = 'col-md-4';
                    col.innerHTML = `
                        <div class="card match-card">
                            <div class="position-relative">
                                <img src="/${match.path}" class="match-img" alt="Match">
                                <span class="similarity-badge">%${match.similarity.toFixed(1)}</span>
                            </div>
                            <div class="card-body text-center">
                                <a href="/${match.path}" target="_blank" class="btn btn-primary btn-sm">
                                    📥 İndir
                                </a>
                            </div>
                        </div>
                    `;
                    grid.appendChild(col);
                });
            }

            document.getElementById('results').style.display = 'block';
        }

        // Hata göster
        function showError(message) {
            document.getElementById('uploadSection').style.display = 'block';
            document.getElementById('error').textContent = message;
            document.getElementById('error').style.display = 'block';
        }

        // Sıfırla
        function resetUpload() {
            selectedFile = null;
            document.getElementById('photoInput').value = '';
            document.getElementById('preview').style.display = 'none';
        }
    </script>
</body>
</html>
